<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WasteWise AI — Smart Waste Classification</title>
    <meta name="description" content="AI-powered waste classification and disposal guidance. Understand your waste. Make better disposal decisions." />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WasteWise AI — Smart Waste Classification" />
    <meta property="og:description" content="AI-powered waste classification and disposal guidance. Understand your waste. Make better disposal decisions." />
    <meta property="og:image" content="/icons/icon-512x512.png" />

    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #040F0A; /* Dark mode bg */
        z-index: 9999;
        transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
      }
      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(47, 143, 91, 0.2);
        border-top-color: #2F8F5B;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 100% { transform: rotate(360deg); } }
      @media (prefers-color-scheme: light) {
        #initial-loader { background-color: #F7FAF8; }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-spinner"></div>
      <p style="margin-top: 16px; font-family: sans-serif; font-weight: 600; color: #2F8F5B; font-size: 14px; letter-spacing: 0.5px;">WasteWise AI</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
